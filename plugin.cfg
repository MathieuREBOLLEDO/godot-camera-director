[plugin]

name="Camera Director"
description="Cinematics and camera triggers for 2D and 3D games: shots (2D frame or 3D pose, blend, hold) played in sequences (player keeps control) or cutscenes (player loses control) by a CameraDirector under the Camera2D or a CameraDirector3D under the Camera3D; CameraTrigger / CameraTrigger3D zones start them. Optional Camera menu in the debug menu. No autoload."
author="MrRobododo"
version="0.2.0"
script="plugin.gd"
